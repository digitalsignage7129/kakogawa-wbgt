<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加古川市 WBGT＆気象ダッシュボード</title>
    <style>
        /* 画面全体：外側へのはみ出しを厳格に禁止 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* 690x728 px の絶対固定枠（サイズを厳守） */
        .widget-box {
            width: 690px;
            max-width: 690px;
            height: 728px;
            max-height: 728px;
            background: #ffffff;
            box-sizing: border-box;
            padding: 20px; /* 余白を少し縮小 */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* ヘッダーエリア */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            height: 50px;
            box-sizing: border-box;
        }
        .header h1 {
            margin: 0;
            font-size: 22px; /* 少し小さく */
            color: #2d3748;
            font-weight: 700;
            line-height: 1.2;
        }
        .header .sub {
            font-size: 11px;
            color: #718096;
            margin-top: 1px;
        }
        .weather-icon-txt {
            font-size: 24px;
            font-weight: bold;
            color: #3182ce;
        }

        /* メインWBGTエリア（高さを少し抑えて見切れ防止） */
        .wbgt-section {
            background: #2ecc71;
            color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: background 0.5s ease;
            height: 130px; /* 150px から 130px に縮小 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .wbgt-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .wbgt-main {
            font-size: 52px; /* 60px から 52px に調整 */
            font-weight: 900;
            margin: 2px 0;
            line-height: 1;
        }
        .wbgt-main span {
            font-size: 24px;
            font-weight: 500;
        }
        .wbgt-status {
            font-size: 18px;
            font-weight: 700;
            background: rgba(0,0,0,0.15);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 3px;
        }

        /* 気象詳細グリッド */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            height: 65px; /* 75px から 65px に縮小 */
            box-sizing: border-box;
        }
        .grid-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .grid-label {
            font-size: 11px;
            color: #718096;
            margin-bottom: 2px;
        }
        .grid-value {
            font-size: 16px;
            font-weight: 700;
            color: #1a202c;
        }
        .grid-value span {
            font-size: 11px;
            font-weight: 500;
            color: #4a5568;
        }

        /* 3時間ごとの予測テーブルエリア（縦幅を最大に確保） */
        .forecast-section {
            height: 330px; /* 縦幅を広げてデータをしっかり見せる */
            margin: 10px 0 0 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .forecast-title {
            font-size: 13px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .table-wrapper {
            flex-grow: 1;
            overflow-y: auto; /* 万が一の際も中で綺麗にスクロール可能に */
        }
        .forecast-table {
            width: 100%;
            border-collapse: collapse;
        }
        .forecast-table th {
            background: #f7fafc;
            color: #718096;
            font-size: 11px;
            padding: 6px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
        }
        .forecast-table td {
            padding: 7px 6px; /* 行の隙間をわずかに引き締め */
            font-size: 12px;  /* 13px から 12px に縮小 */
            color: #4a5568;
            text-align: center;
            border-bottom: 1px solid #edf2f7;
        }

        /* フッター */
        .footer {
            font-size: 10px;
            color: #a0aec0;
            text-align: center;
            border-top: 1px solid #edf2f7;
            padding-top: 6px;
            height: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="widget-box">
    <!-- ヘッダー -->
    <div class="header">
        <div>
            <h1>加古川市 気象ポータル</h1>
            <div class="sub">ピンポイント観測（北緯34.76 東経134.84）</div>
        </div>
        <div id="weather-text" class="weather-icon-txt">--</div>
    </div>

    <!-- メイン暑さ指数 -->
    <div class="wbgt-section" id="wbgt-card">
        <div class="wbgt-label" id="time-label">直近の暑さ指数 (WBGT)</div>
        <div class="wbgt-main"><span id="wbgt-num">--.-</span><span>℃</span></div>
        <div class="wbgt-status" id="wbgt-status">データ取得中...</div>
    </div>

    <!-- 4大気象要素データ -->
    <div class="weather-grid">
        <div class="grid-item">
            <div class="grid-label">気温</div>
            <div class="grid-value" id="cur-temp">--.-<span>℃</span></div>
        </div>
        <div class="grid-item">
            <div class="grid-label">湿度</div>
            <div class="grid-value" id="cur-humidity">--<span>%</span></div>
        </div>
        <div class="grid-item">
            <div class="grid-label">風速</div>
            <div class="grid-value" id="cur-wind">--.-<span>m/s</span></div>
        </div>
        <div class="grid-item">
            <div class="grid-label">降水確率</div>
            <div class="grid-value" id="cur-pop">--<span>%</span></div>
        </div>
    </div>

    <!-- 今後のタイムライン予測 -->
    <div class="forecast-section">
        <div class="forecast-title">⏰ 今後の気象・暑さ指数予測</div>
        <div class="table-wrapper">
            <table class="forecast-table">
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>天気</th>
                        <th>気温</th>
                        <th>湿度</th>
                        <th>風速</th>
                        <th>暑さ指数</th>
                    </tr>
                </thead>
                <tbody id="forecast-tbody">
                    <!-- JSで動的に追加 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- フッター -->
    <div class="footer" id="update-time">
        データ元: 気象庁仕様パブリックデータ (Open-Meteo) | 自動更新
    </div>
</div>

<script>
const lat = 34.7649;
const lon = 134.8404;
const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=2`;

function getWeatherText(code) {
    if (code === 0) return "☀️ 晴れ";
    if (code === 1 || code === 2 || code === 3) return "⛅ 晴れ時々曇";
    if (code === 45 || code === 48) return "🌫️ 霧";
    if (code === 51 || code === 53 || code === 55) return "🌧️ 小雨";
    if (code === 61 || code === 63 || code === 65) return "☔ 雨";
    if (code === 71 || code === 73 || code === 75) return "❄️ 雪";
    if (code === 80 || code === 81 || code === 82) return "🌦️ にわか雨";
    if (code === 95 || code === 96) return "⚡ 雷雨";
    return "☁️ 曇り";
}

function getWbgtLevel(value) {
    const v = parseFloat(value);
    if (v >= 31) return { color: '#e74c3c', text: '危険（運動中止）' };
    if (v >= 28) return { color: '#e67e22', text: '厳重警戒' };
    if (v >= 25) return { color: '#f1c40f', text: '警戒' };
    if (v >= 21) return { color: '#3498db', text: '注意' };
    return { color: '#2ecc71', text: 'ほぼ安全' };
}

function calcWbgt(temp, humidity) {
    return 0.725 * temp + 0.0368 * humidity + 0.00315 * temp * humidity - 3.2;
}

async function updateDashboard() {
    const statusEl = document.getElementById('wbgt-status');
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        const res = await fetch(apiUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        const hourly = data.hourly;
        const now = new Date();
        
        let currentIndex = 0;
        for (let i = 0; i < hourly.time.length; i++) {
            const t = new Date(hourly.time[i]);
            if (t >= now) {
                currentIndex = i;
                break;
            }
        }

        const curTemp = hourly.temperature_2m[currentIndex];
        const curHumidity = hourly.relative_humidity_2m[currentIndex];
        const curWind = (hourly.wind_speed_10m[currentIndex] / 3.6).toFixed(1);
        const curPop = hourly.precipitation_probability[currentIndex];
        const curWbgt = calcWbgt(curTemp, curHumidity).toFixed(1);
        const curWeather = getWeatherText(hourly.weather_code[currentIndex]);

        document.getElementById('weather-text').innerText = curWeather.split(' ')[0];
        document.getElementById('wbgt-num').innerText = curWbgt;
        document.getElementById('cur-temp').innerHTML = `${curTemp.toFixed(1)}<span>℃</span>`;
        document.getElementById('cur-humidity').innerHTML = `${curHumidity}<span>%</span>`;
        document.getElementById('cur-wind').innerHTML = `${curWind}<span>m/s</span>`;
        document.getElementById('cur-pop').innerHTML = `${curPop}<span>%</span>`;

        const level = getWbgtLevel(curWbgt);
        document.getElementById('wbgt-card').style.backgroundColor = level.color;
        statusEl.innerText = level.text;

        const timeObj = new Date(hourly.time[currentIndex]);
        document.getElementById('time-label').innerText = `現在（${timeObj.getHours()}:00）の暑さ指数(WBGT)`;

        const tbody = document.getElementById('forecast-tbody');
        tbody.innerHTML = '';

        let rowCount = 0;
        for (let i = currentIndex; i < hourly.time.length; i++) {
            if (rowCount >= 7) break; // 表示行数を微調整して隙間にフィット
            if ((i - currentIndex) % 3 !== 0) continue;

            const fTime = new Date(hourly.time[i]);
            const fTemp = hourly.temperature_2m[i];
            const fHum = hourly.relative_humidity_2m[i];
            const fWind = (hourly.wind_speed_10m[i] / 3.6).toFixed(1);
            const fWbgt = calcWbgt(fTemp, fHum).toFixed(1);
            const fWeather = getWeatherText(hourly.weather_code[i]);
            const fLevel = getWbgtLevel(fWbgt);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${fTime.getDate()}日 ${fTime.getHours()}:00</td>
                <td>${fWeather}</td>
                <td>${fTemp.toFixed(1)}℃</td>
                <td>${fHum}%</td>
                <td>${fWind}m/s</td>
                <td style="font-weight:bold; color:${fLevel.color}">${fWbgt}℃</td>
            `;
            tbody.appendChild(row);
            rowCount++;
        }

        const rightNow = new Date();
        document.getElementById('update-time').innerText = `データ同期時刻: ${rightNow.toLocaleDateString()} ${rightNow.toLocaleTimeString()} | 加古川市エリア特定`;

    } catch (e) {
        statusEl.innerText = "接続再試行中...";
        setTimeout(updateDashboard, 5000);
    }
}

updateDashboard();
setInterval(updateDashboard, 600000);
</script>

</body>
</html>
