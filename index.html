<style>
    /* 画面全体 */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f4f6f9;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* 外側のはみ出しを完全に禁止 */
    }
    
    /* 690x728 px の絶対固定枠 */
    .widget-box {
        width: 690px;
        max-width: 690px;
        height: 728px;
        max-height: 728px;
        background: #ffffff;
        box-sizing: border-box;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* 要素を上下に綺麗に分散 */
        position: relative;
    }

    /* ヘッダーエリア */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #edf2f7;
        padding-bottom: 12px;
        height: 55px; /* 高さを固定 */
        box-sizing: border-box;
    }
    .header h1 {
        margin: 0;
        font-size: 24px;
        color: #2d3748;
        font-weight: 700;
        line-height: 1.2;
    }
    .header .sub {
        font-size: 12px;
        color: #718096;
        margin-top: 2px;
    }
    .weather-icon-txt {
        font-size: 28px;
        font-weight: bold;
        color: #3182ce;
    }

    /* メインWBGTエリア */
    .wbgt-section {
        background: #2ecc71;
        color: white;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        transition: background 0.5s ease;
        height: 150px; /* 高さを固定 */
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .wbgt-label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.9;
    }
    .wbgt-main {
        font-size: 60px;
        font-weight: 900;
        margin: 5px 0;
        line-height: 1;
    }
    .wbgt-main span {
        font-size: 28px;
        font-weight: 500;
    }
    .wbgt-status {
        font-size: 20px;
        font-weight: 700;
        background: rgba(0,0,0,0.15);
        padding: 4px 15px;
        border-radius: 30px;
        display: inline-block;
        margin-top: 5px;
    }

    /* 気象詳細グリッド */
    .weather-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        height: 75px; /* 高さを固定 */
        box-sizing: border-box;
    }
    .grid-item {
        background: #f7fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 5px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .grid-label {
        font-size: 12px;
        color: #718096;
        margin-bottom: 4px;
    }
    .grid-value {
        font-size: 18px;
        font-weight: 700;
        color: #1a202c;
    }
    .grid-value span {
        font-size: 12px;
        font-weight: 500;
        color: #4a5568;
    }

    /* 3時間ごとの予測テーブルエリア */
    .forecast-section {
        height: 290px; /* テーブル全体の高さを厳格に固定 */
        margin: 15px 0 0 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }
    .forecast-title {
        font-size: 14px;
        font-weight: 700;
        color: #4a5568;
        margin-bottom: 8px;
    }
    .table-wrapper {
        flex-grow: 1;
        overflow-y: auto; /* 万が一溢れても内部スクロールで解決 */
    }
    .forecast-table {
        width: 100%;
        border-collapse: collapse;
    }
    .forecast-table th {
        background: #f7fafc;
        color: #718096;
        font-size: 11px;
        padding: 6px;
        text-align: center;
        border-bottom: 2px solid #e2e8f0;
        position: sticky;
        top: 0;
    }
    .forecast-table td {
        padding: 8px 6px;
        font-size: 13px;
        color: #4a5568;
        text-align: center;
        border-bottom: 1px solid #edf2f7;
    }

    /* フッター */
    .footer {
        font-size: 11px;
        color: #a0aec0;
        text-align: center;
        border-top: 1px solid #edf2f7;
        padding-top: 8px;
        height: 25px; /* 高さを固定 */
        box-sizing: border-box;
    }
</style>
