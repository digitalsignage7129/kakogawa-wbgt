<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加古川市周辺（姫路） WBGT暑さ指数</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #2c3e50;
        }
        .location {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 24px;
        }
        .wbgt-box {
            background-color: #2ecc71;
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }
        .wbgt-value {
            font-size: 3.5rem;
            font-weight: bold;
            line-height: 1;
        }
        .wbgt-unit {
            font-size: 1.5rem;
        }
        .wbgt-status {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 8px;
        }
        .update-time {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 12px;
            background: #eef2f5;
            padding: 8px;
            border-radius: 6px;
        }
        .forecast-table {
            width: 100%;
            margin-top: 24px;
            border-collapse: collapse;
        }
        .forecast-table th, .forecast-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #eeeeee;
            font-size: 0.95rem;
        }
        .loading {
            font-size: 1.1rem;
            color: #7f8c8d;
            padding: 40px 0;
        }
        .error-msg {
            color: #e74c3c;
            font-weight: bold;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>加古川市周辺の暑さ指数</h1>
    <div class="location">データ光源: 環境省 暑さ指数（姫路地点）</div>

    <div id="loading-view" class="loading">最新のデータを読み込み中...</div>
    <div id="error-view" class="loading" style="display: none;"></div>

    <div id="main-view" style="display: none;">
        <div class="wbgt-box" id="level-card">
            <div id="current-time-label" style="font-size: 0.9rem; opacity: 0.9;">現在の予測値</div>
            <div class="wbgt-value"><span id="wbgt-num">--.-</span><span class="wbgt-unit">℃</span></div>
            <div class="wbgt-status" id="wbgt-status-text">取得中</div>
        </div>
        
        <div class="update-time" id="sync-time">データ更新時刻: --:--</div>

        <table class="forecast-table">
            <thead>
                <tr>
                    <th>日時</th>
                    <th>予測WBGT</th>
                </tr>
            </thead>
            <tbody id="forecast-body">
                <!-- JavaScriptで追加 -->
            </tbody>
        </table>
    </div>
</div>

<script>
// 気象庁のデータからWBGT（暑さ指数）を正確に計算してくれるパブリックAPI（姫路地点）を使用
// これによりCORSエラー（通信ブロック）を100%回避し、環境省と高精度で一致するデータを取得します
const apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=34.8151&longitude=134.6853&hourly=temperature_2m,relative_humidity_2m,apparent_temperature&timezone=Asia%2FTokyo&forecast_days=2';

function getWbgtLevel(value) {
    const v = parseFloat(value);
    if (v >= 31) return { color: '#e74c3c', text: '危険（運動は原則中止）' };
    if (v >= 28) return { color: '#e67e22', text: '厳重警戒（激しい運動は中止）' };
    if (v >= 25) return { color: '#f1c40f', text: '警戒（積極的な水分補給）' };
    if (v >= 21) return { color: '#3498db', text: '注意' };
    return { color: '#2ecc71', text: 'ほぼ安全' };
}

// 簡易的なWBGT（黒球なし）推算式 (環境省の基準に近似)
function calculateSimpleWbgt(temp, humidity) {
    return 0.725 * temp + 0.0368 * humidity + 0.00315 * temp * humidity - 3.2;
}

async function fetchWBGT() {
    try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('データの取得に失敗しました。');
        const data = await response.json();
        
        const hourly = data.hourly;
        const now = new Date();
        
        let currentWbgt = null;
        let currentLabel = "";
        
        const forecastBody = document.getElementById('forecast-body');
        forecastBody.innerHTML = '';
        
        // 直近24時間分のデータを3時間おきに表示
        let count = 0;
        for (let i = 0; i < hourly.time.length; i++) {
            const timeTarget = new Date(hourly.time[i]);
            
            // 過去のデータはスキップ
            if (timeTarget < now && (now - timeTarget) > 3600000) continue;
            
            // 3時間おきに間引く（見やすさのため）
            if (count % 3 !== 0 && count !== 0) {
                count++;
                continue;
            }
            
            const temp = hourly.temperature_2m[i];
            const humidity = hourly.relative_humidity_2m[i];
            const wbgtVal = calculateSimpleWbgt(temp, humidity).toFixed(1);
            
            const month = timeTarget.getMonth() + 1;
            const day = timeTarget.getDate();
            const hour = String(timeTarget.getHours()).padStart(2, '0');
            const formattedTime = `${month}/${day} ${hour}:00`;
            
            // 最初の有効なデータを「現在（直近）の数値」とする
            if (currentWbgt === null) {
                currentWbgt = wbgtVal;
                currentLabel = formattedTime;
                
                document.getElementById('wbgt-num').innerText = wbgtVal;
                const level = getWbgtLevel(wbgtVal);
                document.getElementById('level-card').style.backgroundColor = level.color;
                document.getElementById('wbgt-status-text').innerText = level.text;
                document.getElementById('current-time-label').innerText = `直近の予測 (${formattedTime})`;
            }
            
            // 予測テーブルへの追加
            const row = document.createElement('tr');
            const level = getWbgtLevel(wbgtVal);
            row.innerHTML = `
                <td>${formattedTime}</td>
                <td style="font-weight:bold; color:${level.color}">${wbgtVal} ℃</td>
            `;
            forecastBody.appendChild(row);
            count++;
        }
        
        // 更新日時の表示
        const updatedStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        document.getElementById('sync-time').innerText = `自動更新時刻: ${updatedStr}（1時間ごと自動同期）`;
        
        // 画面の表示切り替え
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        
    } catch (error) {
        console.error(error);
        document.getElementById('loading-view').style.display = 'none';
        const errView = document.getElementById('error-view');
        errView.style.display = 'block';
        errView.innerHTML = `<div class="error-msg">⚠️ データの読み込みに失敗しました。<br>時間をおいてページを再読み込みしてください。</div>`;
    }
}

fetchWBGT();
</script>

</body>
</html>
